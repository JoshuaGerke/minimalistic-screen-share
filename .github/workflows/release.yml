name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: bauen und paketieren
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/JoshuaGerke/minimalistic-screen-share/internal/version.Version=${VERSION}"
          mkdir -p dist

          # Windows (amd64)
          mkdir -p dist/windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS} -H=windowsgui" -o dist/windows/mss-share.exe ./cmd/share
          sed -i "s/\$Version *= *\"[^\"]*\"/\$Version    = \"${VERSION}\"/" install.ps1
          cp install.ps1 uninstall.ps1 README.md LICENSE dist/windows/
          (cd dist/windows && zip -qr "../minimalistic-screen-share_${VERSION}_windows_amd64.zip" .)
          # Die eine Datei für normale Nutzer: herunterladen, doppelklicken, fertig.
          cp dist/windows/mss-share.exe dist/MinimalisticScreenShare.exe

          # Linux (amd64, arm64)
          for ARCH in amd64 arm64; do
            mkdir -p "dist/linux-${ARCH}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" go build -trimpath -ldflags "${LDFLAGS}" -o "dist/linux-${ARCH}/mss-share" ./cmd/share
            cp install.sh uninstall.sh README.md LICENSE "dist/linux-${ARCH}/"
            (cd "dist/linux-${ARCH}" && tar czf "../minimalistic-screen-share_${VERSION}_linux_${ARCH}.tar.gz" .)
          done

          ls -lh dist/*.zip dist/*.tar.gz

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MinimalisticScreenShare.exe \
            dist/minimalistic-screen-share_*_windows_amd64.zip \
            dist/minimalistic-screen-share_*_linux_amd64.tar.gz \
            dist/minimalistic-screen-share_*_linux_arm64.tar.gz \
            --title "minimalistic screen share $GITHUB_REF_NAME" \
            --generate-notes
