<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuschauen – minimalistic screen share</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235865f2'/%3E%3Cpath d='M13 10.5l9 5.5-9 5.5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body class="viewer">

<div id="join" class="overlay">
  <form id="join-card" class="card join-card" autocomplete="off">
    <div class="logo">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <rect x="4" y="6" width="24" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12.5 10.5l8 3.5-8 3.5z" fill="currentColor"/>
        <path d="M12 26h8M16 22v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 id="join-title">Bildschirm ansehen</h1>
    <div id="join-session" class="session hidden"></div>
    <p id="join-text" class="muted">Gib die Sitzungs-ID oder den Link ein, den du bekommen hast.</p>
    <input id="room-input" placeholder="Sitzungs-ID oder Link" spellcheck="false" maxlength="300">
    <input id="name-input" placeholder="Dein Name" autocomplete="nickname" maxlength="32">
    <button class="btn primary big wide" type="submit">Zuschauen</button>
    <p id="join-error" class="error hidden"></p>
    <p class="fine">Du teilst dabei nichts von dir – du schaust nur zu.</p>
  </form>
</div>

<div id="stage" class="hidden">
  <main id="screen-wrap">
    <canvas id="screen"></canvas>
  </main>

  <header class="topbar">
    <div class="who">
      <span id="badge" class="badge wait">…</span>
      <span id="title" class="title">–</span>
      <span id="sub" class="sub"></span>
    </div>
    <div class="controls">
      <div class="volume" title="Lautstärke (↑/↓, M = stumm)">
        <button id="btn-mute" class="btn icon" type="button" aria-label="Stumm schalten">
          <svg class="ico-on" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M18.8 6.2a8 8 0 010 11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="ico-off hidden" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <input id="volume" type="range" min="0" max="100" value="100" aria-label="Lautstärke">
      </div>
      <button id="btn-fit" class="btn icon" type="button" title="Originalgröße / Einpassen (O)" aria-label="Größe umschalten">
        <svg viewBox="0 0 24 24" width="19" height="19"><rect x="3.5" y="5.5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-pip" class="btn icon" type="button" title="Bild-in-Bild – schwebt über deinen anderen Fenstern (P)" aria-label="Bild in Bild">
        <svg viewBox="0 0 24 24" width="19" height="19"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg>
      </button>
      <button id="btn-voice" class="btn icon" type="button" title="Sprachkanal" aria-label="Sprachkanal">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 14v-2a8 8 0 0116 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="4" height="7" rx="1.5" fill="currentColor"/><rect x="17" y="13" width="4" height="7" rx="1.5" fill="currentColor"/></svg>
      </button>
      <button id="btn-stats" class="btn icon" type="button" title="Verbindungsdaten (I)" aria-label="Verbindungsdaten">
        <svg viewBox="0 0 24 24" width="19" height="19"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="8" r="1.2" fill="currentColor"/></svg>
      </button>
      <button id="btn-fullscreen" class="btn icon" type="button" title="Vollbild (F)" aria-label="Vollbild">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-leave" class="btn icon danger" type="button" title="Verlassen" aria-label="Verlassen">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div id="overlay-msg" class="center-overlay">
    <div class="spinner"></div>
    <p id="overlay-text" class="big">Verbinde…</p>
    <p id="overlay-fine" class="fine"></p>
    <button id="overlay-btn" class="btn primary hidden" type="button">Neu verbinden</button>
  </div>

  <button id="audio-hint" class="audio-hint hidden" type="button">Ton ist aus – hier klicken zum Einschalten</button>

  <div id="voice-drawer" class="card voice-drawer hidden">
    <h2>Sprachkanal</h2>
    <div id="voice"></div>
  </div>

  <div id="stats-panel" class="stats-panel hidden">
    <span>Auflösung</span><b id="stat-res">–</b>
    <span>Bilder/s</span><b id="stat-fps">–</b>
    <span>Datenrate</span><b id="stat-rate">–</b>
    <span>Ping</span><b id="stat-ping">–</b>
    <span>Ton-Puffer</span><b id="stat-buffer">–</b>
    <span>Tonpegel</span><b id="stat-audio">–</b>
    <span>Zuschauer</span><b id="stat-viewers">–</b>
  </div>
</div>

<script src="/audio-core.js"></script>
<script src="/voice.js"></script>
<script src="/overlay.js"></script>
<script src="/app.js"></script>
</body>
</html>
